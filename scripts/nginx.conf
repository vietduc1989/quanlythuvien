#
# scripts/nginx.conf - Nginx configuration for React Vite Frontend
# Đây là cấu hình mặc định cho Nginx trong Docker container.
# Nó sẽ phục vụ các file tĩnh của React app và proxy các request /api tới backend.
#

server {
    listen 80;
    server_name localhost;

    # Cấu hình log
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Root directory và index file cho ứng dụng React
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Cấu hình để phục vụ các file tĩnh và hỗ trợ routing phía client (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy requests đến /api tới backend API
    # Sử dụng tên service của Docker Compose cho backend API (http://api:8080)
    # Hoặc tên domain/IP của API khi triển khai thực tế
    location /api {
        proxy_pass http://api:8080; # Tên service 'api' trong docker-compose.yml
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ngăn chặn truy cập vào các file cấu hình Nginx bên ngoài
    location ~ /\.ht {
        deny all;
    }
}