version: '3.8'

services:
  # --- PostgreSQL Database Service ---
  db:
    image: postgres:15-alpine
    container_name: book-lending-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - onenet-network

  # --- .NET 10 API Service ---
  api:
    image: ${API_IMAGE:-ghcr.io/vietduc1989/quanlythuvien/api:latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: book-lending-api
    restart: always
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - onenet-network

  # --- React Vite Web Frontend Service ---
  web:
    image: ${WEB_IMAGE:-ghcr.io/vietduc1989/quanlythuvien/web:latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: book-lending-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - onenet-network

networks:
  onenet-network:
    driver: bridge

volumes:
  db-data:
    driver: local
