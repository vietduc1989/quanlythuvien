```yaml
# docker-compose.yml
# Cấu hình Docker Compose để chạy các service của dự án "Quản lý độc giả"
version: '3.8'

services:
  db:
    image: postgres:15-alpine # Sử dụng PostgreSQL làm cơ sở dữ liệu
    container_name: readermanagement-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data # Lưu trữ dữ liệu vào volume để duy trì dữ liệu
    ports:
      - "5432:5432" # Mở cổng 5432 của DB ra ngoài host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"] # Kiểm tra sức khỏe của DB
      interval: 10s # Kiểm tra mỗi 10 giây
      timeout: 5s   # Timeout sau 5 giây
      retries: 5    # Thử lại 5 lần
    env_file:
      - .env # Load biến môi trường từ file .env
    networks:
      - readermanagement-network # Tham gia vào mạng nội bộ

  api:
    build:
      context: . # Build từ thư mục gốc của project
      dockerfile: apps/api/Dockerfile
      target: final # Chỉ build stage cuối cùng (runtime)
    container_name: readermanagement-api
    restart: always
    ports:
      - "8080:8080" # Mở cổng 8080 của API ra ngoài host
    environment:
      ASPNETCORE_URLS: http://+:8080 # Cấu hình ASP.NET Core lắng nghe trên cổng 8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy # Đảm bảo DB khỏe mạnh trước khi khởi động API
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"] # Kiểm tra sức khỏe của API qua endpoint /health
      interval: 30s
      timeout: 10s
      retries: 3
    env_file:
      - .env # Load biến môi trường từ file .env
    networks:
      - readermanagement-network

  web:
    build:
      context: . # Build từ thư mục gốc của project
      dockerfile: apps/web/Dockerfile
      target: final # Chỉ build stage cuối cùng (runtime)
    container_name: readermanagement-web
    restart: always
    ports:
      - "3000:8080" # Mở cổng 3000 của host ra cổng 8080 của container web (Nginx)
    depends_on:
      api:
        condition: service_healthy # Đảm bảo API khỏe mạnh trước khi khởi động Web
    env_file:
      - .env # Load biến môi trường từ file .env
    networks:
      - readermanagement-network

volumes:
  db_data: # Định nghĩa volume để lưu trữ dữ liệu của DB

networks:
  readermanagement-network:
    driver: bridge # Định nghĩa một mạng bridge nội bộ cho các service
```