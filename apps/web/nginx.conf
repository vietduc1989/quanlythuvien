# Cấu hình Nginx cơ bản để phục vụ ứng dụng React Vite và proxy API requests
server {
    listen 80; # Nginx lắng nghe trên cổng 80

    # Proxy các yêu cầu đến đường dẫn /api/ tới dịch vụ API backend
    location /api/ {
        proxy_pass http://api:8080/; # 'api' là tên dịch vụ trong docker-compose, '8080' là cổng của API
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Tùy chỉnh các header nếu cần thiết cho CORS hoặc authentication
    }

    # Phục vụ các file tĩnh của ứng dụng React Vite
    location / {
        root /usr/share/nginx/html; # Thư mục chứa các file build của React
        try_files $uri $uri/ /index.html; # Phục vụ index.html cho các đường dẫn không tìm thấy file (client-side routing)
    }

    # Bổ sung cấu hình khác nếu cần, vị dụ: caching, gzip, SSL
}