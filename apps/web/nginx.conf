```nginx
# apps/web/nginx.conf
# Cấu hình Nginx để phục vụ ứng dụng React Vite
server {
    # Lắng nghe trên cổng 8080, phù hợp khi chạy Nginx dưới quyền non-root
    listen 8080;
    server_name localhost;

    # Cấu hình cho root path
    location / {
        root   /usr/share/nginx/html; # Thư mục chứa các file build của React
        index  index.html index.htm;  # File index mặc định
        try_files $uri $uri/ /index.html; # Phục vụ các file tĩnh hoặc fallback về index.html cho các route của SPA
    }

    # Cấu hình trang lỗi
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
```