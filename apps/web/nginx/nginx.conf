# apps/web/nginx/nginx.conf
# Custom Nginx configuration for the React Vite frontend

server {
    listen 80;
    server_name localhost;

    # Root directory for serving static files
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Handle SPA routing: try file, then directory, then index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy requests to the API backend
    # This assumes your React app makes API calls to /api/*
    # The API service in docker-compose is named 'api'
    location /api/ {
        proxy_pass http://api:8080/; # 'api' is the service name in docker-compose, 8080 is the API's exposed port
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: Serve a custom error page
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}