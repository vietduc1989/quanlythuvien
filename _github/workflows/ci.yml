name: CI/CD Pipeline ONENET

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '20'
  API_IMAGE_NAME: ghcr.io/${{ github.repository }}/api
  WEB_IMAGE_NAME: ghcr.io/${{ github.repository }}/web

jobs:
  build-and-test:
    name: Build and Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- Setup .NET for API ---
      - name: Setup .NET SDK ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore .NET API dependencies
        working-directory: apps/api
        run: dotnet restore ONENET.slnx

      - name: Build .NET API
        working-directory: apps/api
        run: dotnet build ONENET.slnx --configuration Release --no-restore

      - name: Run .NET API Tests
        working-directory: apps/api
        run: dotnet test ONENET.slnx --no-build --verbosity normal || echo "No tests found or failed."

      # --- Setup Node.js for Web ---
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Restore Web Frontend dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Build Web Frontend
        working-directory: apps/web
        run: pnpm run build

      - name: Lint Web Frontend
        working-directory: apps/web
        run: pnpm run lint || echo "No lint script or failed."

  build-docker-images:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Build and push API Docker image ---
      - name: Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE_NAME }}:latest
            ${{ env.API_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Build and push Web Docker image ---
      - name: Build and Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE_NAME }}:latest
            ${{ env.WEB_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_BASE_URL=/api
