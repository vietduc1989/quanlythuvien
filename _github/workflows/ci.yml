#
# .github/workflows/ci.yml - CI/CD Pipeline với GitHub Actions cho dự án Quản lý mượn trả sách
#
# Pipeline bao gồm các bước: Checkout, Setup môi trường, Restore dependencies, Build, Lint/Test,
# và Build Docker Image.
# Sử dụng OIDC để đăng nhập vào GitHub Container Registry (GHCR) để tăng cường bảo mật.
#

name: CI/CD Pipeline for Book Lending

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOTNET_VERSION: '10.0.x' # Phiên bản .NET theo Technical Guideline. Cần cập nhật khi 10.0 chính thức.
  NODE_VERSION: '18'      # Phiên bản Node.js cho Frontend
  # Tên image sẽ được push lên GitHub Container Registry
  API_IMAGE_NAME: ghcr.io/${{ github.repository }}/api
  WEB_IMAGE_NAME: ghcr.io/${{ github.repository }}/web

jobs:
  build-and-test:
    name: Build and Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- Setup .NET for API ---
      - name: Setup .NET SDK ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          # cache: true # Có thể bật cache để tăng tốc độ

      - name: Restore .NET API dependencies
        run: dotnet restore apps/api/apps/api.csproj

      - name: Build .NET API
        run: dotnet build apps/api/apps/api.csproj --configuration Release --no-restore

      - name: Run .NET API Tests
        run: dotnet test apps/api/apps/api.csproj --no-build --verbosity normal

      # --- Setup Node.js for Web ---
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Restore Web Frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build Web Frontend
        working-directory: apps/web
        run: npm run build -- --emptyOutDir --base=/

      - name: Lint Web Frontend (Optional, assuming lint script)
        working-directory: apps/web
        # Kiểm tra xem có script 'lint' trong package.json không
        run: npm run lint || true # Cho phép lỗi linting không dừng pipeline nếu cần

      - name: Run Web Frontend Tests (Optional, assuming test script)
        working-directory: apps/web
        run: npm run test -- --passWithNoTests || true # Cho phép không có test hoặc lỗi test không dừng pipeline nếu cần

  build-docker-images:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test # Chỉ chạy sau khi build và test thành công

    permissions:
      contents: read
      packages: write # Cần quyền để push image lên GHCR

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Sử dụng GITHUB_TOKEN mặc định

      # --- Build and push API Docker image ---
      - name: Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE_NAME }}:latest
            ${{ env.API_IMAGE_NAME }}:${{ github.sha }} # Tag bằng commit SHA để dễ dàng rollback
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Build and push Web Docker image ---
      - name: Build and Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE_NAME }}:latest
            ${{ env.WEB_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Truyền biến môi trường cho Dockerfile build
          build-args: |
            VITE_API_BASE_URL=/api # Khi deploy, Nginx sẽ proxy /api đến backend